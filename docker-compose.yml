version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agriconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agriconnect-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/agriconnect?schema=public"
      JWT_SECRET: "agriconnect_production_secret_key_change_me"
      JWT_REFRESH_SECRET: "agriconnect_production_refresh_key_change_me"
    depends_on:
      - postgres

volumes:
  postgres_data:
